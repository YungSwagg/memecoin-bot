name: Memecoin Bot Monitor

on:
  schedule:
    - cron: "*/15 * * * *"   # ogni 15 minuti (GitHub può ritardare leggermente in orari di picco)
  workflow_dispatch: {}       # permette anche l'avvio manuale dalla tab "Actions"

permissions:
  contents: write            # necessario per fare commit dello state.json aggiornato

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor cycle
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_WALLET: ${{ secrets.DISCORD_WEBHOOK_WALLET }}
          DISCORD_WEBHOOK_SIGNALS: ${{ secrets.DISCORD_WEBHOOK_SIGNALS }}
          DISCORD_WEBHOOK_TRACKED: ${{ secrets.DISCORD_WEBHOOK_TRACKED }}
        run: python memecoin_bot.py --once

      - name: Commit updated state
        run: |
          git config user.name "memecoin-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Aggiorna stato bot [skip ci]"
          git push
